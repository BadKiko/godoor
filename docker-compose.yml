version: '3.8'

services:
  godoor:
    image: badkiko/godoor:latest
    container_name: godoor
    ports:
      - "8080:8080"
    volumes:
      - ./data:/app/data
      - ./godoor.db:/app/godoor.db
    environment:
      - GODOOR_DB_PATH=/app/godoor.db
      - PORT=8080
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:8080/api/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - godoor-network

networks:
  godoor-network:
    driver: bridge

volumes:
  godoor_data:
    driver: local